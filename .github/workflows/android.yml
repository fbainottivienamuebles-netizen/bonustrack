# Genera el APK de Android en la nube (no hace falta Android Studio).
# Se publica como "Release" en GitHub para descargarlo directo desde el celular.
name: APK Android

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web
        run: npm run build -w mobile

      - name: Copiar la web al proyecto Android
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Preparar clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64 (ver README)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/letras.p12"

      - name: Compilar APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/letras.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleRelease --no-daemon --console=plain > "$RUNNER_TEMP/gradle.log" 2>&1; then
            tail -60 "$RUNNER_TEMP/gradle.log"
            # Publica el motivo como anotación (visible en el resumen del build).
            MSG=$(sed -n '/What went wrong/,/Try:/p' "$RUNNER_TEMP/gradle.log" | head -15 | tr '\n' ' ')
            echo "::error title=Gradle::${MSG:-$(tail -5 "$RUNNER_TEMP/gradle.log" | tr '\n' ' ')}"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/letras-en-vivo.apk"

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" "$RUNNER_TEMP/letras-en-vivo.apk" \
            --title "Letras en vivo 1.0.${{ github.run_number }}" \
            --notes "APK generado desde ${{ github.sha }}. Descargalo desde el celular e instalalo." \
            --latest
